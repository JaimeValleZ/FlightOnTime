server:
  #port: 8090
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: msvc-flight-prediction
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://mysql:3306/flight_prediction docker
    #url: jdbc:mysql://localhost:3306/flight_prediction local
    #url: jdbc:mysql://mysql-gofly-gofly-72.b.aivencloud.com:15750/defaultdb?sslMode=REQUIRED #Koyeb con Aiven MySQL
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
eureka:
  instance:
    #hostname: flight-prediction
    #hostname: localhost
    hostname: ${HOSTNAME}
  client:
    service-url:
      #defaultZone: http://eureka:8761/eureka/
      #defaultZone: http://localhost:8761/eureka/
      defaultZone: ${EUREKA_URL}


feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 3000

# SWAGGER/OpenAPI Config
springdoc:
  packages-to-scan:
    - com.alura.flight_prediction.controller
  packages-to-exclude:
    - com.alura.flight_prediction.client
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  paths-to-match:
    - /api/**
    - /prediccion/**
    - /usuarios/**
    - /vuelos/stats/**
    - /login/**


logging:
  level:
    org.springdoc: DEBUG
    org.springframework.web: INFO
