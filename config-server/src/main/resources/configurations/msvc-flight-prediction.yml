server:
  port: 8090

spring:
  application:
    name: msvc-flight-prediction
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/flight_prediction
    username: flight_user
    password: flight123
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
eureka:
  instance:
    hostname: flight-prediction
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 3000

# SWAGGER/OpenAPI Config
springdoc:
  packages-to-scan:
    - com.alura.flight_prediction.controller
  packages-to-exclude:
    - com.alura.flight_prediction.client
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  paths-to-match:
    - /api/**
    - /prediccion/**
    - /usuarios/**
    - /vuelos/stats/**
    - /login/**
