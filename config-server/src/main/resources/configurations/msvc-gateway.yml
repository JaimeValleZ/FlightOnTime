eureka:
  client:
    register-with-eureka: false

server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      routes:

        - id: prediccion
          uri: http://flight-prediction:8090
          predicates:
            - Path=/prediccion/**

        - id: api-routes
          uri: http://flight-prediction:8090
          predicates:
            - Path=/api/**

        - id: FlightStats
          uri: http://flight-prediction:8090
          predicates:
            - Path=/vuelos/stats/**

        - id: auth
          uri: http://flight-prediction:8090
          predicates:
            - Path=/login/**,/usuarios/**

        - id: spring-doc
          uri: http://flight-prediction:8090
          predicates:
            - Path=/v3/api-docs/**, /swagger-ui/**, /swagger-ui.html