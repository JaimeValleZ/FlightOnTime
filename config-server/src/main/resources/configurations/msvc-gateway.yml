eureka:
  client:
    register-with-eureka: false

server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true #Configurar que habilita el gateway para redireccionar los otros microservicios
      routes:
        - id: vuelos
          uri: http://localhost:8090
          predicates:
            - Path=/prediccion/**
            - Path=/api/**